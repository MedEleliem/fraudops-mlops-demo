name: model-registry-ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  model-registry:
    runs-on: ubuntu-latest
    container: docker://dvcorg/cml:0-dvc2-base1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install -r requirements-mlflow.txt

      - name: Reproduce model pipeline
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          dvc pull creditcard.csv --run-cache
          dvc repro

      - name: Register candidate model
        run: |
          VERSION="fraud-logit-${GITHUB_SHA::7}"
          python scripts/register_model.py \
            --version "$VERSION" \
            --stage development \
            --status candidate \
            --copy-artifacts
          echo "MODEL_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Log MLflow run
        run: |
          python scripts/log_mlflow_run.py --run-name "$MODEL_VERSION"

      - name: Compare candidate with active registry model
        run: |
          python scripts/compare_models.py \
            "$MODEL_VERSION" \
            fraud-logit-2021-05-18 \
            --fail-on-gate > model-diff.json

      - name: Upload model diff
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-diff
          path: model-diff.json
